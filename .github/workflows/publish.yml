name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # PyPI trusted publishing (OIDC); no stored tokens
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version and changelog
        run: |
          python - <<'PY'
          import re

          tag = "${{ github.ref_name }}".removeprefix("v")
          init = re.search(r'__version__ = "([^"]+)"',
                           open("aud/__init__.py").read()).group(1)
          pyproject = re.search(r'version = "([^"]+)"',
                                open("pyproject.toml").read()).group(1)

          assert tag == init == pyproject, (
              f"release discipline violated: tag v{tag}, "
              f"__init__ {init}, pyproject {pyproject}"
          )

          changelog = open("CHANGELOG.md").read()
          assert f"## [{tag}]" in changelog, (
              f"CHANGELOG.md has no section for [{tag}]"
          )
          print(f"tag v{tag} matches package version and changelog")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # flip to true once the first automated release is verified
          attestations: false
