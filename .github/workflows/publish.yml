name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing reviewed release tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      distribution-artifact-id: ${{ steps.distributions.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version and changelog
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          release_tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", release_tag), "expected vMAJOR.MINOR.PATCH"
          tagged = subprocess.check_output(["git", "rev-parse", f"refs/tags/{release_tag}^{{commit}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert tagged == head, "checkout must point to the requested release tag"
          tag = release_tag.removeprefix("v")
          init = re.search(r'__version__ = "([^"]+)"',
                           open("aud/__init__.py").read()).group(1)
          with open("pyproject.toml", "rb") as file:
              pyproject = tomllib.load(file)["project"]["version"]

          assert tag == init == pyproject, (
              f"release discipline violated: tag v{tag}, "
              f"__init__ {init}, pyproject {pyproject}"
          )

          changelog = open("CHANGELOG.md").read()
          assert f"## [{tag}]" in changelog, (
              f"CHANGELOG.md has no section for [{tag}]"
          )
          print(f"tag v{tag} matches package version and changelog")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Store distributions for the publishing job
        id: distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve this run's validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.distribution-artifact-id }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # flip to true once the first automated release is verified
          attestations: false
