name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing reviewed release tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      distribution-artifact-id: ${{ steps.distributions.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version and changelog
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          release_tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", release_tag), "expected vMAJOR.MINOR.PATCH"
          tagged = subprocess.check_output(["git", "rev-parse", f"refs/tags/{release_tag}^{{commit}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert tagged == head, "checkout must point to the requested release tag"
          tag = release_tag.removeprefix("v")
          init = re.search(r'__version__ = "([^"]+)"',
                           open("aud/__init__.py").read()).group(1)
          with open("pyproject.toml", "rb") as file:
              pyproject = tomllib.load(file)["project"]["version"]

          assert tag == init == pyproject, (
              f"release discipline violated: tag v{tag}, "
              f"__init__ {init}, pyproject {pyproject}"
          )

          changelog = open("CHANGELOG.md").read()
          assert f"## [{tag}]" in changelog, (
              f"CHANGELOG.md has no section for [{tag}]"
          )
          print(f"tag v{tag} matches package version and changelog")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Validate distribution integrity before review
        run: python tools/check_distributions.py --output "$RUNNER_TEMP/distribution-integrity.json"

      - name: Record distribution hashes for review
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          files = sorted(Path("dist").iterdir())
          assert len(files) == 2, "expected one wheel and one source distribution"
          assert sum(p.name.endswith(".whl") for p in files) == 1
          assert sum(p.name.endswith(".tar.gz") for p in files) == 1
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Distribution review\n\n")
              summary.write("Complete the release evidence checklist against these files before approving the pypi deployment.\n\n")
              summary.write("```text\n")
              for path in files:
                  assert path.is_file() and not path.is_symlink()
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  summary.write(f"{digest}  {path.name}\n")
              summary.write("```\n")
          PY

      - name: Store distributions for the publishing job
        id: distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Record immutable artifact identity
        env:
          ARTIFACT_ID: ${{ steps.distributions.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.distributions.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.distributions.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          printf '\nArtifact ID: `%s`\n\nDownload: %s\n\nArtifact archive SHA-256: `%s`\n' \
            "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    environment:
      name: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve this run's validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.distribution-artifact-id }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # flip to true once the first automated release is verified
          attestations: false
