name: Release candidate evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Prepare scanner environments
        run: |
          mkdir -p .release-evidence
          git rev-parse HEAD > .release-evidence/commit.txt
          python -m venv "$RUNNER_TEMP/security-tools"
          "$RUNNER_TEMP/security-tools/bin/pip" install bandit==1.9.4 pip-audit==2.10.1
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep==1.181.0
          "$RUNNER_TEMP/security-tools/bin/pip" freeze > .release-evidence/security-tools.txt
          "$RUNNER_TEMP/semgrep/bin/pip" freeze > .release-evidence/semgrep-tools.txt
      - name: Bandit
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/security-tools/bin/bandit" -r aud -f json -o .release-evidence/bandit.json'
      - name: Semgrep
        if: ${{ !cancelled() }}
        run: |
          curl --fail --location --retry 3 --max-time 60 --max-filesize 2097152 \
            --user-agent 'Semgrep/1.181.0' --output .release-evidence/python-rules.yml https://semgrep.dev/c/p/python
          sha256sum .release-evidence/python-rules.yml > .release-evidence/python-rules-sha256.txt
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config .release-evidence/python-rules.yml \
            --error --metrics=off --json --output .release-evidence/semgrep.json aud
      - name: Gitleaks history and working tree
        if: ${{ !cancelled() }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version > .release-evidence/gitleaks-version.txt
          status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --report-format json --report-path .release-evidence/gitleaks-history.json . || status=1
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --report-format json --report-path .release-evidence/gitleaks-tree.json . || status=1
          exit "$status"
      - name: Audit development and runtime dependency resolution
        if: ${{ !cancelled() }}
        run: |
          python -m venv "$RUNNER_TEMP/dependencies"
          "$RUNNER_TEMP/dependencies/bin/pip" install --report .release-evidence/dependency-install.json '.[dev,cli]'
          "$RUNNER_TEMP/dependencies/bin/pip" freeze --exclude aud > .release-evidence/dependencies.txt
          "$RUNNER_TEMP/security-tools/bin/python" -m pip_audit --disable-pip --no-deps \
            -r .release-evidence/dependencies.txt --format json --output .release-evidence/pip-audit.json
      - name: Retain scanner evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-security-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .release-evidence/
          if-no-files-found: error
          retention-days: 14

  distribution-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build and check metadata
        run: |
          mkdir -p .release-evidence
          git rev-parse HEAD > .release-evidence/commit.txt
          python -m pip install build==1.6.1 twine==7.0.0
          python -m pip freeze > .release-evidence/build-tools.txt
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > .release-evidence/distribution-sha256.txt
      - name: Validate archive metadata, paths, RECORD, and package consistency
        run: python tools/check_distributions.py --output .release-evidence/archive-members.json
      - name: Install wheel and sdist outside checkout
        run: |
          for kind in wheel source; do
            python -m venv "$RUNNER_TEMP/install-$kind"
            if [ "$kind" = wheel ]; then package=("$GITHUB_WORKSPACE"/dist/*.whl); else package=("$GITHUB_WORKSPACE"/dist/*.tar.gz); fi
            "$RUNNER_TEMP/install-$kind/bin/pip" install "${package[0]}"
            mkdir "$RUNNER_TEMP/smoke-$kind"
            (
              cd "$RUNNER_TEMP/smoke-$kind"
              "$RUNNER_TEMP/install-$kind/bin/python" -I - <<'PY'
          import importlib.metadata
          import sys
          from pathlib import Path
          import aud
          assert Path(aud.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert aud.__version__ == importlib.metadata.version("aud")
          assert isinstance(aud.json_schema(), dict)
          print(f"Installed aud {aud.__version__}: {aud.__file__}")
          PY
            )
            "$RUNNER_TEMP/install-$kind/bin/pip" check
          done
      - name: Prepare installed regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version > .release-evidence/ffmpeg-version.txt
          for kind in wheel source; do
            "$RUNNER_TEMP/install-$kind/bin/pip" install pytest==9.1.1 jsonschema==4.26.0
            "$RUNNER_TEMP/install-$kind/bin/pip" freeze > ".release-evidence/installed-$kind.txt"
          done
      - name: Observe installed wheel and sdist imports
        run: |
          status=0
          for kind in wheel source; do
            (
              cd "$RUNNER_TEMP/smoke-$kind"
              timeout 30 "$RUNNER_TEMP/install-$kind/bin/python" -I "$GITHUB_WORKSPACE/tools/check_import.py" \
                --report "$GITHUB_WORKSPACE/.release-evidence/import-$kind.json"
            ) || status=1
          done
          exit "$status"
      - name: Run installed wheel regressions
        run: |
          python tools/check_installed.py --python "$RUNNER_TEMP/install-wheel/bin/python" \
            --scratch "$RUNNER_TEMP/regressions-wheel" --report .release-evidence/installed-wheel.xml
      - name: Run installed sdist regressions
        if: ${{ !cancelled() }}
        run: |
          python tools/check_installed.py --python "$RUNNER_TEMP/install-source/bin/python" \
            --scratch "$RUNNER_TEMP/regressions-source" --report .release-evidence/installed-source.xml
      - name: Retain distribution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            dist/
            .release-evidence/
          if-no-files-found: error
          retention-days: 14
